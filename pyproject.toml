[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "reqdeck"
dynamic = ["version"]
description = "Requirements, open questions and traceability in your git repo — a CLI, a TUI, and skills for your AI agent"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Daniel Riege" }]
requires-python = ">=3.11"
dependencies = ["textual>=8.0"]
keywords = ["requirements", "traceability", "v-model", "requirements-engineering", "tui",
            "claude-code", "ai-agents", "doors"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Documentation",
]

[project.urls]
Homepage = "https://github.com/danielriege/reqdeck"
Source = "https://github.com/danielriege/reqdeck"
Issues = "https://github.com/danielriege/reqdeck/issues"
Changelog = "https://github.com/danielriege/reqdeck/blob/main/CHANGELOG.md"

[project.scripts]
reqdeck = "reqdeck.cli:main"

[tool.hatch.version]
path = "reqdeck/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["reqdeck"]

# The skills live at the repository root, where the Claude Code plugin finds
# them, and ship inside the package, where `reqdeck init` copies them from.
[tool.hatch.build.targets.wheel.force-include]
"skills" = "reqdeck/skills"

[tool.hatch.build.targets.sdist]
include = ["reqdeck", "skills", "tests", "examples", "README.md", "CHANGELOG.md", "LICENSE", "pyproject.toml"]
