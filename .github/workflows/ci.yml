name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install .
      - run: python -m unittest discover tests -v
      - name: The example passes check with the installed command
        working-directory: examples/tick
        run: reqdeck check

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install build twine
      - run: python -m build
      - run: twine check --strict dist/*
      - name: The wheel carries the skills, the themes and the template init copies
        run: |
          unzip -l dist/*.whl | grep -q "reqdeck/skills/reqdeck-cli/SKILL.md"
          unzip -l dist/*.whl | grep -q "reqdeck/skills/reqdeck-method/references/markers.md"
          unzip -l dist/*.whl | grep -q "reqdeck/themes/dracula.toml"
          unzip -l dist/*.whl | grep -q "reqdeck/templates/OPEN-QUESTIONS.md"
