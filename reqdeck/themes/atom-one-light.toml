# One Light — https://github.com/atom/one-light-syntax

name = "atom-one-light"
title = "One Light"

[colors]
foreground    = "#383a42"   # mono-1
muted         = "#a0a1a7"   # mono-3
border        = "#c8c8ca"   # border
border_active = "#4078f2"   # blue
border_search = "#0184bc"   # cyan
selection     = "#e5e5e6"   # selection
title         = "#4078f2"   # blue
heading       = "#a626a4"   # purple
id            = "#0184bc"   # cyan
link          = "#4078f2"   # blue
link_active   = "#986801"   # orange
code          = "#50a14f"   # green
table_header  = "#c18401"   # yellow
statement_bar = "#a626a4"   # purple
accepted      = "#50a14f"   # green
proposed      = "#c18401"   # yellow
reopened      = "#e45649"   # red
security      = "#a626a4"   # purple
open          = "#e45649"   # red
answered      = "#50a14f"   # green
keys          = "#a626a4"   # purple
