name: Release

# Publishing a GitHub release tests the package on every supported Python, then
# builds it and uploads it to PyPI, with PyPI's trusted publishing: no token is
# stored anywhere. Nothing is published unless every test passes.
on:
  release:
    types: [published]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install .
      - run: python -m unittest discover tests -v
      - name: The example passes check with the installed command
        working-directory: examples/tick
        run: reqdeck check

  pypi:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/reqdeck/
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: The tag is the version
        run: |
          version=$(python -c "import re; print(re.search(r'__version__ = \"(.+)\"', open('reqdeck/__init__.py').read())[1])")
          test "v${version}" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} is not v${version}"; exit 1; }
      - name: The changelog names the version
        run: |
          version=${GITHUB_REF_NAME#v}
          grep -q "^## \[${version}\]" CHANGELOG.md || { echo "CHANGELOG.md has no section for ${version}"; exit 1; }
      - run: pip install build twine
      - run: python -m build
      - run: twine check --strict dist/*
      - name: The wheel carries the skills, the themes and the template init copies
        run: |
          unzip -l dist/*.whl | grep -q "reqdeck/skills/reqdeck-cli/SKILL.md"
          unzip -l dist/*.whl | grep -q "reqdeck/skills/reqdeck-method/references/markers.md"
          unzip -l dist/*.whl | grep -q "reqdeck/themes/dracula.toml"
          unzip -l dist/*.whl | grep -q "reqdeck/templates/OPEN-QUESTIONS.md"
      - uses: pypa/gh-action-pypi-publish@release/v1
